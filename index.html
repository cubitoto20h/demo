<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang mồi - Web Service Faculty / Student</title>

    <!-- File CSS giao diện -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h1>QUẢN LÝ SINH VIÊN THEO KHOA</h1>

    <!-- =========================================================
         CHỌN KHOA BẰNG COMBOBOX
         ========================================================= -->
    <div class="card">
        <h2>Chọn khoa</h2>

        <label for="facultySelect">Khoa:</label>
        <select id="facultySelect">
            <!-- Có thể đổi danh sách này theo đề thi -->
            <option value="">-- Chọn khoa --</option>
            <option value="1">Information Technology</option>
            <option value="2">Accounting</option>
            <option value="3">Marketing</option>
        </select>

        <!-- Nút tải lại dữ liệu của khoa đang chọn -->
        <button type="button" id="btnLoad">Load dữ liệu</button>
    </div>


    <!-- =========================================================
         FORM THÊM / SỬA SINH VIÊN
         ========================================================= -->
    <div class="card">
        <h2>Thêm / Sửa sinh viên</h2>

        <div class="form-grid">
            <div>
                <label for="studentId">ID:</label>
                <input type="number" id="studentId" placeholder="Nhập ID">
            </div>

            <div>
                <label for="studentName">Tên:</label>
                <input type="text" id="studentName" placeholder="Nhập tên">
            </div>

            <div>
                <label for="studentEmail">Email:</label>
                <input type="email" id="studentEmail" placeholder="Nhập email">
            </div>
            <div>
                <label for="studentPhone">Phone:</label>
                <input type="phone" id="studentPhone" placeholder="Nhập Phone">
            </div>
                        <div>
                <label for="studentAddress">Address:</label>
                <input type="address" id="studentAddress" placeholder="Nhập Address">
            </div>
        </div>

        <div class="button-group">
            <button type="button" id="btnAdd">Thêm mới</button>
            <button type="button" id="btnUpdate">Sửa</button>
            <button type="button" id="btnClear">Làm mới form</button>
        </div>
    </div>

    <!-- =========================================================
         TABLE HIỂN THỊ DỮ LIỆU JSON
         ========================================================= -->
    <div class="card">
        <h2>Danh sách sinh viên</h2>

        <table id="studentTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Họ tên</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Thao tác</th>
            </tr>
            </thead>

            <!-- JavaScript sẽ dùng DOM để thêm các dòng vào đây -->
            <tbody id="studentTableBody">
            </tbody>
        </table>

        <p id="message" class="message"></p>
    </div>
</div>

<!-- File JavaScript xử lý Web Service + DOM -->
<script src="js/main.js"></script>
</body>
</html>
